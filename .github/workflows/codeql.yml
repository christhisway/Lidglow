# Scans Lidglow's Swift and Objective-C code with CodeQL on every push and pull request to main,
# and once a week. Lidglow has no Xcode project or Package.swift (Scripts/build.sh calls swiftc
# directly), so CodeQL's default setup can't build it. This workflow builds it by hand instead,
# on the same runner the Release workflow uses, since the code targets macOS 27.
# GitHub's default setup must be switched off for this workflow's results to be accepted:
# Settings → Code security → CodeQL analysis → ⋯ → Switch to advanced.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Ad hoc signing only. CodeQL just needs to watch the compiler run.
      - name: Build
        run: Scripts/build.sh

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
